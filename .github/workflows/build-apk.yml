name: TIGER X Android APK (Fixed)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare Flutter source
        run: |
          mkdir -p lib
          if [ -f main.dart ] && [ ! -f lib/main.dart ]; then cp main.dart lib/main.dart; fi
          test -f pubspec.yaml
          test -f lib/main.dart

      - name: Generate Android project files
        run: flutter create . --platforms=android --org com.tigerx --project-name tiger_x

      - name: Add Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          marker = '<manifest'
          idx = s.find('>')
          permissions = '\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />'
          if 'android.permission.INTERNET' not in s:
              s = s[:idx+1] + permissions + s[idx+1:]
          p.write_text(s)
          PY

      - name: Get Flutter packages
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TIGER-X-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
